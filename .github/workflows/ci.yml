name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: v5.8.3
  KUBECONFORM_VERSION: v0.8.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: shellcheck
        run: shellcheck -x bin/visionkb bin/visionkb-k8s libexec/*.sh slurm/visionkb.sbatch scripts/*.sh
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run yamllint -s .
      - name: k8s/base in sync with versions.env
        run: bin/visionkb-k8s sync --check
      - name: Public-repo hygiene
        run: scripts/hygiene-check.sh

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: bats (argument parsing, settings, bundle commands)
        run: PATH="$PWD/.venv/bin:$PATH" bats tests/bats

  bundle-py39:
    # bundle.py runs as a plain script on the Python 3.9 of HPC nodes: keep it compatible.
    name: bundle.py on Python 3.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: |
          python tests/fixtures/make_fixture_release.py "$RUNNER_TEMP/rel" visionkb-0000.01.1
          python src/visionkb_deploy/bundle.py verify-dir "$RUNNER_TEMP/rel/visionkb-0000.01.1"
          python src/visionkb_deploy/bundle.py pack "$RUNNER_TEMP/rel/visionkb-0000.01.1" --out "$RUNNER_TEMP/b"
          python src/visionkb_deploy/bundle.py unpack "$RUNNER_TEMP/b/visionkb-0000.01.1.tar" --dest "$RUNNER_TEMP/u"

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config (placeholder settings)
        run: |
          d="$RUNNER_TEMP/compose"; mkdir -p "$d"
          cp compose/.env.example "$d/.env"; cp config/visionkb.env.example "$d/visionkb.env"
          sed -i "s#^VISIONKB_ENV_FILE=.*#VISIONKB_ENV_FILE=$d/visionkb.env#" "$d/.env"
          cd compose
          docker compose --env-file ../versions.env --env-file "$d/.env" config -q
          docker compose --env-file ../versions.env --env-file "$d/.env" --profile load --profile backup config --services

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          k="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}"
          curl -fsSL "$k/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C "$RUNNER_TEMP/bin"
          c="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSL "$c/kubeconform-linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render both overlays and the per-release templates
        env:
          VISIONKB_KUSTOMIZE: kustomize
        run: |
          out="$RUNNER_TEMP/k8s"; mkdir -p "$out"
          for o in local-bundle fetch-bundle; do bin/visionkb-k8s --overlay "$o" render > "$out/$o.yaml"; done
          for t in load-release fetch-bundle upload-pod; do bin/visionkb-k8s render-template "$t" visionkb-2026.11.0 > "$out/tmpl-$t.yaml"; done
          cp k8s/base/secrets.example.yaml k8s/overlays/fetch-bundle/bundle-auth.example.yaml "$out/"
      - name: kubeconform
        run: kubeconform -strict -summary -kubernetes-version 1.33.0 "$RUNNER_TEMP"/k8s/*.yaml

  install:
    name: Install with pip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: visionkb-bundle --version
