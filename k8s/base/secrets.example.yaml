# TEMPLATE ONLY: never commit real values. Not listed in kustomization.yaml.
# Create the real Secrets from the files `bin/visionkb init` generates (mode 600) with
#   bin/visionkb-k8s create-secrets --from /path/to/<instance>/secrets
# (init with VISIONKB_PG_HOST=postgres VISIONKB_PG_PORT=5432 so the DSN points at the in-cluster Service).
# Mounted as files, matching the *_FILE convention (contracts section 9).
apiVersion: v1
kind: Secret
metadata:
  name: visionkb-neo4j
  namespace: visionkb
type: Opaque
stringData:
  neo4j_password: CHANGE_ME_generated_by_visionkb_init
---
apiVersion: v1
kind: Secret
metadata:
  name: visionkb-postgres
  namespace: visionkb
type: Opaque
stringData:
  pg_password: CHANGE_ME_generated_by_visionkb_init
---
apiVersion: v1
kind: Secret
metadata:
  name: visionkb-api
  namespace: visionkb
type: Opaque
stringData:
  pg_dsn: postgresql://visionkb:CHANGE_ME@postgres:5432/visionkb
  # one line per token: <token><TAB><scopes>
  api_tokens: "CHANGE_ME\tread"
---
# visionkb-web: a read token listed in api_tokens, the cookie signing key and the access codes (one per line,
# >= 16 characters). No Anthropic key: users enter their own Claude key in the browser.
apiVersion: v1
kind: Secret
metadata:
  name: visionkb-web
  namespace: visionkb
type: Opaque
stringData:
  api_token_read: CHANGE_ME_same_token_as_a_read_line_in_api_tokens
  web_secret: CHANGE_ME_generated_by_visionkb_init
  web_access_codes: CHANGE_ME_generated_by_visionkb_init
