name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches pyproject and the CLIs
        run: |
          ver="${GITHUB_REF_NAME#v}"
          want=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [[ "$ver" == "$want" ]] || { echo "tag $GITHUB_REF_NAME != pyproject version $want"; exit 1; }
          bin/visionkb --version | grep -qx "visionkb-deploy $ver"
          bin/visionkb-k8s sync --check
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="visionkb-deploy ${GITHUB_REF_NAME}. Pinned images (versions.env):"$'\n\n'"\`\`\`"$'\n'"$(grep -E '^VISIONKB_' versions.env)"$'\n'"\`\`\`"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes
