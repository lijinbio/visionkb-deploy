# TEMPLATE, rendered per release by `bin/visionkb-k8s load-release <id>` (Jobs are immutable, so they are
# not part of kustomization.yaml). Placeholders: __KG_RELEASE__, __KG_RELEASE_DNS__, __NEO4J_IMAGE__,
# __TOOLS_IMAGE__, __LOAD_HEAP__, __LOAD_PAGECACHE__.
# 1. verify: re-check every manifest checksum of /bundles/releases/<id> and write the expected node ids and
#            relationship keys from the import CSVs (tools image, python stdlib)
# 2. load:   neo4j-admin import into a NEW store /releases/<id>, post_import.cypher, compare every node id and
#            relationship key with the CSVs (fails on any difference), LOADED.json
# The served store is never touched; switching to the new release is a separate step (switch).
apiVersion: batch/v1
kind: Job
metadata:
  name: visionkb-load-__KG_RELEASE_DNS__
  namespace: visionkb
  labels:
    app.kubernetes.io/name: visionkb-load-release
    app.kubernetes.io/part-of: visionkb
    visionkb.org/kg-release: __KG_RELEASE__
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: visionkb-load-release
        app.kubernetes.io/part-of: visionkb
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          # ReadWriteOnce volumes: run on the node where neo4j runs (if it runs).
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: neo4j
      initContainers:
        - name: verify
          image: __TOOLS_IMAGE__
          command: ["sh", "-c"]
          args:
            - >-
              python3 /opt/visionkb/bundle.py verify-dir /bundles/releases/__KG_RELEASE__ --release __KG_RELEASE__ &&
              python3 /opt/visionkb/bundle.py expected-ids /bundles/releases/__KG_RELEASE__ --out /expected
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: bundles
              mountPath: /bundles
              readOnly: true
            - name: scripts
              mountPath: /opt/visionkb
              readOnly: true
            - name: expected
              mountPath: /expected
      containers:
        - name: load
          image: __NEO4J_IMAGE__
          command: ["bash", "/opt/visionkb/neo4j-load-release.sh"]
          env:
            - name: VISIONKB_KG_RELEASE
              value: __KG_RELEASE__
            - name: VISIONKB_RELEASE_DIR
              value: /bundles/releases/__KG_RELEASE__
            - name: VISIONKB_TARGET_DIR
              value: /releases/__KG_RELEASE__
            - name: NEO4J_PASSWORD_FILE
              value: /run/secrets/visionkb/neo4j_password
            - name: VISIONKB_LOAD_HEAP
              value: __LOAD_HEAP__
            - name: VISIONKB_LOAD_PAGECACHE
              value: __LOAD_PAGECACHE__
            - name: VISIONKB_EXPECTED_IDS_DIR
              value: /expected
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bundles
              mountPath: /bundles
              readOnly: true
            - name: releases
              mountPath: /releases
            - name: scripts
              mountPath: /opt/visionkb
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/visionkb
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: expected
              mountPath: /expected
              readOnly: true
      volumes:
        - name: bundles
          persistentVolumeClaim:
            claimName: visionkb-bundles
        - name: releases
          persistentVolumeClaim:
            claimName: neo4j-releases
        - name: scripts
          configMap:
            name: visionkb-scripts
        - name: secrets
          secret:
            secretName: visionkb-neo4j
            defaultMode: 0440
            items:
              - key: neo4j_password
                path: neo4j_password
        - name: tmp
          emptyDir: {}
        - name: expected
          emptyDir: {}
