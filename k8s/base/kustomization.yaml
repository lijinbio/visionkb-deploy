# VisionKB on Kubernetes (production: the Eye server). Apply an overlay, not the base:
#   bin/visionkb-k8s apply        (overlay chosen by VISIONKB_K8S_OVERLAY: local-bundle | fetch-bundle)
# Secrets are created separately (secrets.example.yaml); per-release Jobs are templates in jobs/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: visionkb
labels:
  - pairs:
      app.kubernetes.io/part-of: visionkb
resources:
  - namespace.yaml
  - storage.yaml
  - neo4j.yaml
  - postgres.yaml
  - api.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - backup-cronjob.yaml
configMapGenerator:
  - name: visionkb-settings
    envs:
      - settings.env
  # Copies of libexec/neo4j-load-release.sh and src/visionkb_deploy/bundle.py (bin/visionkb-k8s sync).
  - name: visionkb-scripts
    files:
      - scripts/neo4j-load-release.sh
      - scripts/bundle.py
    options:
      disableNameSuffixHash: true
# BEGIN images (generated by `bin/visionkb-k8s sync` from versions.env; do not edit)
images:
  - name: neo4j
    digest: sha256:7dbd307cc8f35d6a061cf71659d3d8f783c3db9e8c2f5bb9d54f77921931952a
  - name: postgres
    digest: sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
  - name: ghcr.io/lijinbio/visionkb-api
    digest: sha256:87d2ef8a1023433792ccfe08da3db3d85484bd9253fe6cd07b8624c5e28e7dab
# END images
